name: Publish EarForge 11.32.0 verified
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-earforge-11320.yml]
concurrency:
  group: earforge-publication
  cancel-in-progress: false
permissions:
  contents: read
env:
  SITE: /tmp/earforge-site
  REPORT: /tmp/earforge-report
  SITE_URL: https://ksbmtj995d-cyber.github.io/EarForge/
  PLAN_SHA: 6947b0f21f97723e823a255ca01e6e2cb08e9cd2
  BROWSER_SHA: 062e4a7b4795e0333fd7f23ddd801ff2d8a39e2b
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STAGE: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 11e047d3b105f33c7fa19b0d50f85780f1eef350
          persist-credentials: false
      - name: Execute verified preparation and browser checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/control"
          "$RUNNER_TEMP/control/bin/pip" -q install PyYAML==6.0.2
          "$RUNNER_TEMP/control/bin/python" - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request,yaml
          sha=os.environ['PLAN_SHA']
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=60) as r:data=base64.b64decode(json.load(r)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          plan=yaml.safe_load(data)
          for step in plan['jobs'][os.environ['STAGE']]['steps']:
            if 'run' not in step:continue
            script=step['run'].replace('d91f85a21393fb4a60516e6c55c084915f0bed82',os.environ['BROWSER_SHA']).replace("if name=='browser.py':","if False:")
            print('::group::'+step['name'],flush=True)
            subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
            print('::endgroup::',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earforge-11320-verification
          path: /tmp/earforge-report/
          if-no-files-found: error
          retention-days: 14
  verify-live:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STAGE: verify-live
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: earforge-11320-verification
          path: /tmp/earforge-report/
      - name: Verify the actual canonical Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/control"
          "$RUNNER_TEMP/control/bin/pip" -q install PyYAML==6.0.2
          "$RUNNER_TEMP/control/bin/python" - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request,yaml
          from pathlib import Path
          def blob(sha):
            req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=60) as r:data=base64.b64decode(json.load(r)['content'])
            assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
            return data
          plan=yaml.safe_load(blob(os.environ['PLAN_SHA']))
          path=Path(os.environ['RUNNER_TEMP'])/'live-browser.py';path.write_bytes(blob(os.environ['BROWSER_SHA']))
          for step in plan['jobs'][os.environ['STAGE']]['steps']:
            if 'run' not in step:continue
            script=step['run']
            if step['name']=='Execute the canonical published page and reload offline':script='"$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/live-browser.py" --live'
            print('::group::'+step['name'],flush=True)
            subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
            print('::endgroup::',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earforge-11320-live-verification
          path: /tmp/earforge-report/
          retention-days: 14
