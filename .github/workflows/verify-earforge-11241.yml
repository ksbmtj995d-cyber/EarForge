name: Verify EarForge 11.24.1
on:
  push:
    paths:
      - .github/workflows/verify-earforge-11241.yml
permissions:
  contents: write
  pages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify release and publish clean tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release.json
          grep -q '11\.24\.1' release.json
          test -f loader.js
          test -f boot.js
          test -f payload/app/00.txt
          test -f payload/questions/08a.txt
          test -f payload/direct11241/frontiers/00.txt
          node --check loader.js
          node --check boot.js
          node --check sw.js
          touch .earforge-11241
          BASE=$(git rev-parse HEAD^)
          rm -rf .github
          git config user.name 'ksbmtj995d-cyber'
          git config user.email 'ksbmtj995d@privaterelay.appleid.com'
          git add -A
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'EarForge 11.24.1' | git commit-tree "$TREE" -p "$BASE")
          git push --force origin "$COMMIT:refs/heads/gh-pages"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/pages/builds" >/dev/null || true
