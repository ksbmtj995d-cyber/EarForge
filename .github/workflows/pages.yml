name: Deploy EarForge Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify and prepare site
        shell: bash
        run: |
          rm -rf _site
          (cd dist && sha256sum -c EarForge_v0.10.0_SHA256.txt)
          mkdir _site
          unzip -q dist/EarForge_v0.10.0.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          test -f _site/manifest.webmanifest
          test -f _site/src/timbres.js

      - name: Synchronize current Pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init
          git checkout --orphan gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish current EarForge site"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
